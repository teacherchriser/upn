<p style="font-size: 20px; color: #bf2024;">Espera un momento. Serás redireccionado en <span id="contador"></span> segundos...</p>

  <script>
    // ⚙️ CONFIGURACIÓN: cambia aquí los segundos y la URL de destino
    var SEGUNDOS = 7;
    var URL_DESTINO = "https://script.google.com/macros/s/AKfycbwC0lrbeBHuM-eTVIGOy1zNwK4jhmyqb4nULpYGWBBN-3Lo0UzWA_xy1wvhsMDGD2M9/exec";

    // No necesitas modificar nada de aquí hacia abajo
    var restante = SEGUNDOS;
    var contador = document.getElementById("contador");
    contador.textContent = restante;

    var intervalo = setInterval(function () {
      restante--;
      contador.textContent = restante;
      if (restante <= 0) {
        clearInterval(intervalo);
        window.location.href = URL_DESTINO;
      }
    }, 1000);
  </script>
